name: Build and Push Docker Image

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Regenerate go.sum for Linux
      run: |
        rm -f go.sum
        go mod tidy
        go mod verify

    - name: Commit updated go.sum
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if ! git diff --quiet go.sum; then
          git add go.sum
          git commit -m "chore: auto-regenerate go.sum for Linux [skip ci]"
          git push
        fi
      continue-on-error: true
      if: github.event_name == 'push'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: |
          your-username/k8s-pod-alert:latest
          your-username/k8s-pod-alert:${{ github.run_number }}
        no-cache: true
