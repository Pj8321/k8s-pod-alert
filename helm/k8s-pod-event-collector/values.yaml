image:
  repository: ghcr.io/example/k8s-pod-event-collector
  tag: v0.1.0
  pullPolicy: IfNotPresent

replicaCount: 1

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

env:
  clusterName: "change-me"
  slackWebhookUrl: "https://hooks.slack.com/services/CHANGE/ME"
  alertOnRestart: true
  alertOnCompletion: true
  alertOnEviction: true
  muteSeconds: 120
  ignoreExitCodeZero: true
